<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternTrack | Internship Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>InternTrack 💼</h1>
    <p>Your personal internship application tracker</p>
  </header>

  <main>
    <h2>My Dashboard</h2>

    <section class="stats">
      <div class="stat-card">
        <h3 id="totalCount">0</h3>
        <p>Total Applications</p>
      </div>

      <div class="stat-card">
        <h3 id="interviewCount">0</h3>
        <p>Interviews</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Add an Internship</h2>

      <form id="internshipForm">
        <label for="company">Company Name</label>
        <input id="company" type="text"
          placeholder="e.g. Google" required>

        <label for="role">Job Role</label>
        <input id="role" type="text"
          placeholder="e.g. Software Intern" required>

        <label for="deadline">Application Deadline</label>
        <input id="deadline" type="date" required>

        <label for="status">Application Status</label>
        <select id="status">
          <option>Saved</option>
          <option>Applied</option>
          <option>Test</option>
          <option>Interview</option>
          <option>Selected</option>
          <option>Rejected</option>
        </select>

        <button type="submit">Add Internship</button>
      </form>
    </section>

    <section class="list-section">
      <h2>My Applications</h2>

      <div id="internshipList">
        <p>No internships added yet. Start by adding one!</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
